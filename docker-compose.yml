version: "3.9"

services:
  # ── FastAPI Backend ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_ai_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Streamlit Frontend Dashboard ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_ai_frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://backend:8000
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
